<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout - CS Tech Store</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;

            font-family: Arial, sans-serif;

            background: #f5f6f7;

            color: #111217;
        }

        .checkout-container {
            max-width: 900px;

            margin: 0 auto;

            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.08);
        }

        .header {
            margin-bottom: 30px;
        }

        .header span {
            color: #087f5b;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 2px;
        }

        .header h1 {
            margin: 8px 0;

            font-size: 34px;
        }

        .header p {
            color: #777;
        }


        /* CUSTOMER INFORMATION */

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            font-size: 20px;

            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: bold;
        }

        input,
        textarea {

            width: 100%;

            padding: 13px 15px;

            margin-bottom: 17px;

            border: 1px solid #d9dde1;

            border-radius: 8px;

            font-size: 14px;

            outline: none;

            color: #111217;

            background: white;
        }

        input:focus,
        textarea:focus {

            border-color: #087f5b;

            box-shadow:
                0 0 0 3px
                rgba(8, 127, 91, 0.1);
        }

        textarea {
            min-height: 100px;

            resize: vertical;
        }


        /* ORDER SUMMARY */

        .order-summary {

            background: #f7f8f9;

            padding: 22px;

            border-radius: 12px;

            border: 1px solid #e5e8ea;
        }

        .order-item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 13px 0;

            border-bottom:
                1px solid #e1e4e6;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .product-name {
            font-weight: 600;
        }

        .product-quantity {
            color: #777;

            font-size: 13px;
        }

        .product-price {
            font-weight: bold;
        }

        .total {

            display: flex;

            justify-content: space-between;

            margin-top: 18px;

            padding-top: 18px;

            border-top:
                2px solid #dfe3e5;

            font-size: 21px;

            font-weight: bold;
        }

        .total-price {
            color: #063b2c;
        }


        /* PLACE ORDER */

        .place-order {

            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background: #063b2c;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .place-order:hover {
            background: #07533e;

            transform: translateY(-1px);
        }


        /* BACK */

        .back {

            display: block;

            margin-top: 20px;

            text-align: center;

            color: #063b2c;

            text-decoration: none;

            font-weight: 600;
        }

        .back:hover {
            color: #087f5b;
        }


        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }

            .checkout-container {
                padding: 22px;
            }

            .header h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>

<div class="checkout-container">


    <div class="header">

        <span>
            CS TECH STORE
        </span>

        <h1>
            🛒 Checkout
        </h1>

        <p>
            Please enter your information to complete your order.
        </p>

    </div>


    <!-- CUSTOMER INFORMATION -->

    <form
        method="POST"
        action="{{ url_for('checkout') }}"
    >

        <div class="section">

            <h2>
                Customer Information
            </h2>


            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                value="{{ name }}"
                placeholder="Enter your full name"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                value="{{ email }}"
                placeholder="Enter your email"
                required
            >


            <label>
                Phone Number
            </label>

            <input
                type="text"
                name="phone"
                value="{{ phone }}"
                placeholder="Enter your phone number"
                required
            >


            <label>
                Delivery Address
            </label>

            <textarea
                name="address"
                placeholder="Enter your delivery address"
                required
            >{{ address }}</textarea>

        </div>


        <!-- ORDER SUMMARY -->

        <div class="section">

            <h2>
                Order Summary
            </h2>


            <div class="order-summary">

                {% for item in cart_items %}

                <div class="order-item">

                    <div>

                        <div class="product-name">
                            {{ item.name }}
                        </div>

                        <div class="product-quantity">
                            Quantity: {{ item.quantity }}
                        </div>

                    </div>


                    <div class="product-price">

                        ${{ "%.2f"|format(item.subtotal) }}

                    </div>

                </div>

                {% endfor %}


                <div class="total">

                    <span>
                        Total
                    </span>

                    <span class="total-price">
                        ${{ "%.2f"|format(total) }}
                    </span>

                </div>

            </div>

        </div>


        <button
            type="submit"
            class="place-order"
        >
            Place Order
        </button>

    </form>


    <a
        href="{{ url_for('view_cart') }}"
        class="back"
    >
        ← Back to Cart
    </a>


</div>

</body>

</html>
