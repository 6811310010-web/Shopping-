<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Successful</title>

    <style>

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f5f6f7;

            font-family: Arial, sans-serif;

            color: #111217;

        }

        .success-box {

            width: 90%;

            max-width: 600px;

            background: white;

            padding: 50px 35px;

            text-align: center;

            border-radius: 16px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.08);

        }

        .success-icon {

            font-size: 65px;

            margin-bottom: 15px;

        }

        h1 {

            margin: 0 0 12px;

            color: #063b2c;

        }

        p {

            color: #777;

        }

        .order-id {

            margin: 25px 0;

            padding: 15px;

            background: #f4f6f7;

            border-radius: 8px;

            font-size: 14px;

        }

        .button {

            display: inline-block;

            margin-top: 15px;

            padding: 13px 25px;

            border-radius: 8px;

            background: #063b2c;

            color: white;

            text-decoration: none;

            font-weight: bold;

        }

        .button:hover {

            background: #07533e;

        }

    </style>

</head>


<body>

<div class="success-box">

    <div class="success-icon">
        ✅
    </div>

    <h1>
        Order Successful!
    </h1>

    <p>
        Thank you, {{ name }}!
    </p>

    <p>
        Your order has been placed successfully.
    </p>


    <div class="order-id">

        <strong>
            Order ID
        </strong>

        <br>

        {{ order_id }}

        <br><br>

        <strong>
            Total:
        </strong>

        ${{ "%.2f"|format(total) }}

    </div>


    <a
        href="{{ url_for('index') }}"
        class="button"
    >
        Continue Shopping
    </a>

</div>

</body>

</html>
